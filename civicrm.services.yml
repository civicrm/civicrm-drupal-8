services:
  civicrm:
    class: Drupal\civicrm\Civicrm
  civicrm.page_state:
    class: Drupal\civicrm\CivicrmPageState
  civicrm.breadcrumb:
    class: Drupal\civicrm\CivicrmBreadcrumbBuilder
    arguments: ['@string_translation', '@civicrm.page_state']
    tags:
      - { name: breadcrumb_builder, priority: 1002 }
  civicrm.path_processor:
    class: Drupal\civicrm\PathProcessor\CivicrmPathProcessor
    tags:
      - { name: path_processor_inbound, priority: 250 }
  civicrm.event_subscriber_registrar:
    class: Drupal\civicrm\EventSubscriberRegistrar
    arguments: ['@service_container', []]
  civicrm.cache_invalidator:
    class: Drupal\civicrm\Cache\CivicrmCacheInvalidator
    arguments:
      - '@cache_tags.invalidator'
      - '@plugin.manager.block'
      - '@plugin.manager.menu.local_task'
    public: true
  civicrm.cache_flush_subscriber:
    class: Drupal\civicrm\EventSubscriber\CacheFlushSubscriber
    arguments: ['@civicrm.cache_invalidator']
    tags:
      - { name: civicrm.event_subscriber }
